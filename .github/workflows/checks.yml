name: 静态检查与单元测试

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d student"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/student

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 类型检查 + 迁移编号守门 + 作废术语守门
      - run: npm run check

      # 154 个 HTTP 用例 + 运维用例（测试自己会拉起 next 并连上面的 Postgres）
      - run: npm test
